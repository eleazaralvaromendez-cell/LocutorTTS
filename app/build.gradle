plugins {
    id 'com.android.application'
}

android {
    namespace 'com.locutortts.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.locutortts.app"
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName "1.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
